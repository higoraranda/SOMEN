<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>logo test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
  body{margin:0;font-family:'Montserrat',sans-serif;background:#14110b;color:#f3ecdd}
  .row{display:flex;align-items:center;gap:40px;flex-wrap:wrap;padding:30px 40px;border-bottom:1px solid #333}
  .amberbg{background:#ffaa00}
  .chip{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:sans-serif;font-size:11px;color:#888}
  /* wordmark */
  .wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:.16em;font-size:1.5rem;display:inline-flex;align-items:center;line-height:1;padding-left:.16em}
  .wm-o{position:relative;display:inline-block}
  .wm-mo{position:absolute;left:50%;top:-0.46em;width:1.05em;height:0.4em;transform:translateX(-50%);fill:#ffaa00}
  .wm-reg{font-size:.42em;font-weight:700;vertical-align:super;letter-spacing:0;margin-left:.12em}
  .wm-lg{font-size:3rem}
  .wm-xl{font-size:5rem}
  .light .wordmark{color:#14110b}.light .wm-mo{fill:#14110b}
</style></head>
<body>
  <div class="row">
    <span class="chip"><svg width="72" height="72" viewBox="0 0 120 56"><g fill="#14110b" transform="translate(0,10)"><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z"/><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z" transform="translate(120,0) scale(-1,1)"/></g></svg><span>mustache</span></span>
    <span class="chip amberbg"><img src="assets/favicon.png" width="80" height="80"><span style="color:#333">favicon 80</span></span>
    <span class="chip amberbg"><img src="assets/favicon.png" width="32" height="32"><span style="color:#333">32</span></span>
    <span class="chip amberbg"><img src="assets/favicon.png" width="16" height="16"><span style="color:#333">16</span></span>
  </div>

  <div class="row">
    <span class="wordmark">S<span class="wm-o">O<svg viewBox="0 0 120 56" class="wm-mo"><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z"/><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 1１5 １５ Ｃ１１２ Ｃ１０６ Ｃ１００ Ｃ９４ Ｃ８４ Ｃ７４ Ｃ６６ Ｃ６３ Ｃ６１ Ｃ６０ Z" transform="translate(１２０，０) scale(－１，１)"/></svg></span>MEN<span class="wm-reg">®</span></span>
    <span class="wordmark wm-lg">S<span class="wm-o">O<svg viewBox="0 0 120 56" class="wm-mo"><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z"/><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z" transform="translate(120,0) scale(-1,1)"/></svg></span>MEN<span class="wm-reg">®</span></span>
  </div>

  <div class="row light amberbg">
    <span class="wordmark wm-xl">S<span class="wm-o">O<svg viewBox="0 0 120 56" class="wm-mo"><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z"/><path d="M60 18 C72 14 82 13 90 14 C100 15 105 12 110 13 C114 12 115 15 112 17 C106 19 100 18 94 20 C84 23 74 29 66 29 C63 29 61 27 60 25 Z" transform="translate(120,0) scale(-1,1)"/></svg></span>MEN<span class="wm-reg">®</span></span>
  </div>
</body></html>
